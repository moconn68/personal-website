    <text x="210" y="460">Web Audio engine</text>
    <text x="670" y="460">Canvas 2D renderer</text>
  </g>
  <g fill="#b9addb" text-anchor="middle" font-size="12">
    <text x="100" y="92">mouse, touch, keyboard</text>
    <text x="320" y="92">src/interaction</text>
    <text x="550" y="92">world · settings · ui</text>
    <text x="775" y="92">src/ui</text>
    <text x="440" y="237">src/engine · one rAF per frame</text>
    <text x="440" y="367">sim/ · boids + wire crossings</text>
    <text x="210" y="482">Karplus-Strong worklet → reverb → limiter</text>
    <text x="670" y="482">sky, wires, birds, sparks</text>
  </g>

  <g stroke="#e8c887" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="75" x2="226" y2="75"/>
    <line x1="410" y1="75" x2="456" y2="75"/>
    <line x1="644" y1="75" x2="686" y2="75" marker-start="url(#arrow)"/>
    <line x1="550" y1="110" x2="480" y2="181"/>
    <line x1="440" y1="255" x2="440" y2="311"/>
    <path d="M360,385 C330,410 260,410 230,426"/>
    <path d="M520,385 C550,410 620,410 650,426"/>
    <path d="M570,220 C700,220 740,300 700,426"/>
  </g>

  <g fill="#e8c887" font-size="12" font-style="italic">
    <text x="452" y="289">step(dt)</text>
    <text x="200" y="400" text-anchor="end">pluck events</text>
    <text x="505" y="405" text-anchor="end">birds (zero-copy)</text>
    <text x="505" y="420" text-anchor="end">+ pluck events</text>
    <text x="712" y="300">draw</text>
    <text x="512" y="150" text-anchor="end">sync wires,</text>
