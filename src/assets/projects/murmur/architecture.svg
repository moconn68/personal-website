<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c887"/>
    </marker>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16132e"/>
      <stop offset="1" stop-color="#2a1f45"/>
    </linearGradient>
  </defs>

  <rect width="880" height="520" rx="16" fill="url(#sky)"/>

  <g fill="#231f45" stroke="#8f7fc7" stroke-width="1.5">
    <rect x="20"  y="40"  width="160" height="70" rx="10"/>
    <rect x="230" y="40"  width="180" height="70" rx="10"/>
    <rect x="460" y="40"  width="180" height="70" rx="10"/>
    <rect x="690" y="40"  width="170" height="70" rx="10"/>
    <rect x="310" y="185" width="260" height="70" rx="10" stroke="#e8c887"/>
    <rect x="310" y="315" width="260" height="70" rx="10"/>
    <rect x="60"  y="430" width="300" height="70" rx="10"/>
    <rect x="520" y="430" width="300" height="70" rx="10"/>
  </g>

  <g fill="#f3e9d8" text-anchor="middle" font-size="15" font-weight="600">
    <text x="100" y="70">Pointer &amp; keys</text>
    <text x="320" y="70">Interaction</text>
    <text x="550" y="70">Stores</text>
    <text x="775" y="70">React chrome</text>
    <text x="440" y="215">Engine loop</text>
